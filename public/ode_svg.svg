<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" aria-labelledby="odeTitle odeDesc">
    <title id="odeTitle">Ode - Animation d'écriture manuscrite (Calligraphie Absolue)</title>
    <desc id="odeDesc">Animation de très haute qualité du mot Ode. L'animation inclut un lever de plume réaliste entre le 'O' et le 'd', avec un espacement parfait.</desc>

    <defs>
        <!-- Gradient subtil d'obsidienne et de charbon pour un effet d'encre luxueuse -->
        <linearGradient id="ink-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="50%" stop-color="#e4e4e7"/>
            <stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>

        <!-- Ombre portée ultra-douce pour donner un effet de matière et de volume à l'encre -->
        <filter id="luxury-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
        </filter>

        <!-- Tracé n°1 : La lettre 'O'. 
             Parfaitement arrondie, finissant par un petit rebond vers l'extérieur. -->
        <path id="ode-o" pathLength="100" d="
            M 360 140
            C 320 80, 240 120, 250 230
            C 260 340, 350 350, 380 270
            C 395 210, 375 160, 355 160
            C 335 160, 330 200, 350 240
            C 360 260, 380 270, 410 250
        " />

        <!-- Tracé n°2 : Les lettres 'de'. 
             Commence par le haut du 'd' après la levée virtuelle de la plume. 
             La hampe est droite, la liaison est longue et le 'e' respire. -->
        <path id="ode-de" pathLength="100" d="
            M 480 220
            C 450 180, 410 190, 410 250
            C 410 310, 460 320, 485 260
            C 500 180, 510 100, 510 70
            C 505 120, 495 200, 490 280
            C 485 330, 520 330, 550 280
            C 570 230, 550 200, 535 220
            C 520 240, 525 300, 555 310
            C 585 320, 620 300, 650 270
        " />
    </defs>

    <style>
        .calligraphy-group {
            /* Centre le motif globalement et active l'ombre portée */
            transform: translate(30px, 40px);
            filter: url(#luxury-shadow);
        }

        /* Base commune pour l'effet matière de l'encre */
        .ink-path {
            fill: none;
            stroke: url(#ink-gradient);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.7; 
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
        }

        /* L'animation du O (Temps 1) */
        .anim-o {
            animation: drawO 8s cubic-bezier(0.35, 0.0, 0.25, 1) infinite;
        }

        /* L'animation du DE (Temps 2) */
        .anim-de {
            animation: drawDE 8s cubic-bezier(0.35, 0.0, 0.25, 1) infinite;
        }

        /* Séquence millimétrée du "O" */
        @keyframes drawO {
            0%   { stroke-dashoffset: 100; opacity: 0; }
            4%   { stroke-dashoffset: 100; opacity: 0.7; }
            20%  { stroke-dashoffset: 0; opacity: 0.7; }  /* Fini d'écrire */
            85%  { stroke-dashoffset: 0; opacity: 0.7; }  /* Reste visible */
            95%  { stroke-dashoffset: 100; opacity: 0.7; } /* S'efface en dernier */
            100% { stroke-dashoffset: 100; opacity: 0; }
        }

        /* Séquence millimétrée du "de" (Attend que le "O" soit fini) */
        @keyframes drawDE {
            0%   { stroke-dashoffset: 100; opacity: 0; }
            21%  { stroke-dashoffset: 100; opacity: 0; }  /* Micro-pause (plume levée) */
            22%  { stroke-dashoffset: 100; opacity: 0.7; }
            42%  { stroke-dashoffset: 0; opacity: 0.7; }  /* Fini d'écrire */
            75%  { stroke-dashoffset: 0; opacity: 0.7; }  /* Reste visible */
            85%  { stroke-dashoffset: 100; opacity: 0.7; } /* S'efface en premier (effet rembobinage fluide) */
            100% { stroke-dashoffset: 100; opacity: 0; }
        }
    </style>

    <g class="calligraphy-group">
        <!-- Rectangle invisible empêchant le bug de clipping du filtre (drop-shadow) pendant l'animation -->
        <rect x="200" y="50" width="600" height="400" fill="none" pointer-events="none"/>
        
        <!-- ========================================== -->
        <!-- MATRICE DU "O" : 15 couches de matière       -->
        <!-- ========================================== -->
        <use href="#ode-o" x="0.0" y="0.0" class="ink-path anim-o" />
        <use href="#ode-o" x="0.3" y="-0.3" class="ink-path anim-o" />
        <use href="#ode-o" x="0.6" y="-0.6" class="ink-path anim-o" />
        <use href="#ode-o" x="0.9" y="-0.9" class="ink-path anim-o" />
        <use href="#ode-o" x="1.2" y="-1.2" class="ink-path anim-o" />
        <use href="#ode-o" x="1.5" y="-1.5" class="ink-path anim-o" />
        <use href="#ode-o" x="1.8" y="-1.8" class="ink-path anim-o" />
        <use href="#ode-o" x="2.1" y="-2.1" class="ink-path anim-o" />
        <use href="#ode-o" x="2.4" y="-2.4" class="ink-path anim-o" />
        <use href="#ode-o" x="2.7" y="-2.7" class="ink-path anim-o" />
        <use href="#ode-o" x="3.0" y="-3.0" class="ink-path anim-o" />
        <use href="#ode-o" x="3.3" y="-3.3" class="ink-path anim-o" />
        <use href="#ode-o" x="3.6" y="-3.6" class="ink-path anim-o" />
        <use href="#ode-o" x="3.9" y="-3.9" class="ink-path anim-o" />
        <use href="#ode-o" x="4.2" y="-4.2" class="ink-path anim-o" />

        <!-- ========================================== -->
        <!-- MATRICE DU "de" : 15 couches de matière      -->
        <!-- ========================================== -->
        <use href="#ode-de" x="0.0" y="0.0" class="ink-path anim-de" />
        <use href="#ode-de" x="0.3" y="-0.3" class="ink-path anim-de" />
        <use href="#ode-de" x="0.6" y="-0.6" class="ink-path anim-de" />
        <use href="#ode-de" x="0.9" y="-0.9" class="ink-path anim-de" />
        <use href="#ode-de" x="1.2" y="-1.2" class="ink-path anim-de" />
        <use href="#ode-de" x="1.5" y="-1.5" class="ink-path anim-de" />
        <use href="#ode-de" x="1.8" y="-1.8" class="ink-path anim-de" />
        <use href="#ode-de" x="2.1" y="-2.1" class="ink-path anim-de" />
        <use href="#ode-de" x="2.4" y="-2.4" class="ink-path anim-de" />
        <use href="#ode-de" x="2.7" y="-2.7" class="ink-path anim-de" />
        <use href="#ode-de" x="3.0" y="-3.0" class="ink-path anim-de" />
        <use href="#ode-de" x="3.3" y="-3.3" class="ink-path anim-de" />
        <use href="#ode-de" x="3.6" y="-3.6" class="ink-path anim-de" />
        <use href="#ode-de" x="3.9" y="-3.9" class="ink-path anim-de" />
        <use href="#ode-de" x="4.2" y="-4.2" class="ink-path anim-de" />
    </g>
</svg>